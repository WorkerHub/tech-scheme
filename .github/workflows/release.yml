name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG
        run: |
          python3 - <<'PYEOF'
          import re
          tag = "${{ github.ref_name }}"
          version = tag.lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[?v?" + re.escape(version) + r"\b.*?(?=^## |\Z)", text, re.S | re.M)
          notes = m.group(0).strip() if m else ""
          # drop the version heading line itself; keep the body
          if notes:
              notes = "\n".join(notes.splitlines()[1:]).strip()
          open("release-notes.md", "w", encoding="utf-8").write(notes)
          print("notes bytes:", len(notes))
          PYEOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists, skip."
          elif [ -s release-notes.md ]; then
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file release-notes.md
          else
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          fi
